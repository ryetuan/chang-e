<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}
    
    {{ if eq .Type "short-story" }}
      {{ block "main" . }}{{ end }}
    {{ else }}
      <main class="wrapper">
        {{ block "main" . }}{{ end }}
      </main>
    {{ end }}
    
    {{ partial "footer.html" . }}
  </body>
</html>
